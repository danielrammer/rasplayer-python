# Keep all default playback clients on the Raspberry Pi analogue output.
# RasPlayer also addresses card 0 explicitly when changing the PCM volume.
pcm.rasplayer_playback {
    type plug
    slave.pcm "hw:0,0"
}

pcm.!default {
    type asym
    playback.pcm "rasplayer_playback"
}

ctl.!default {
    type hw
    card 0
}
