image boot.vfat {
  vfat {
    files = {
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup.dat",
      "rpi-firmware/start.elf",
      "bcm2710-rpi-3-b-plus.dtb",
      "bcm2710-rpi-3-b.dtb",
      "bcm2837-rpi-3-b.dtb",
      "Image",
      "rpi-firmware/overlays"
    }
  }
  size = 64M
}

image sdcard.img {
  hdimage {
    partition-table-type = "dos"
  }
  partition boot {
    partition-type = 0x0c
    bootable = true
    align = 1M
    image = "boot.vfat"
  }
  partition rootfs {
    partition-type = 0x83
    align = 1M
    image = "rootfs.ext4"
  }
}
